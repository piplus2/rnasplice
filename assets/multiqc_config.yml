report_comment: >
  This report has been generated by the <a href="https://github.com/nf-core/rnasplice/tree/dev" target="_blank">nf-core/rnasplice</a> analysis pipeline. For information about how to interpret these results, please see the <a href="https://nf-co.re/rnasplice/dev/docs/output" target="_blank">documentation</a>.

report_section_order:
  "rmats_section":
    before: samtools
  "nf-core-rnasplice-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nf-core-rnasplice-summary":
    order: -1002

export_plots: true
disable_version_detection: true

top_modules:
  - fail_trimmed_samples

# Order of modules
module_order:
  - fastqc
  - trim_galore
  - fail_trimmed_samples
  - star
  - salmon
  - featurecounts
  - samtools

custom_data:
  fail_trimmed_samples:
    section_name: "WARNING: Fail Trimming Check"
    description: "List of samples that failed the minimum trimmed reads threshold specified via the '--min_trimmed_reads' parameter. These samples have still been used downstream but should be examined further."
    plot_type: "table"
    pconfig:
      id: "fail_trimmed_samples_table"
      table_title: "Samples failed trimming threshold"
      namespace: "Samples failed trimming threshold"
      format: "{:.0f}"

  rmats_summary:
    parent_id: "rmats_section"
    parent_name: "rMATS"
    parent_description: >
      Tool to detect differential alternative splicing events.
      <a href="https://rnaseq-mats.sourceforge.net/" target="_blank">https://rnaseq-mats.sourceforge.net/</a> DOI: <a href="http://dx.doi.org/10.1007/978-1-62703-514-9_10" target="_blank">10.1007/978-1-62703-514-9_10</a>
    id: "rmats_summary"
    section_name: "Differential Splicing Summary"
    description: "Summary of splicing events detected by rMATS. This table includes the total number of events detected (JC) and the number of significant events (JC) for each contrast and event type."
    plot_type: "table"
    pconfig:
      id: "rmats_table"
      title: "rMATS Splicing Events"
    headers:
      Contrast_Event:
        title: "Contrast - Event Type"
      Contrast:
        title: "Contrast"
      EventType:
        title: "Event Type"
      TotalEventsJC:
        title: "Total Events (JC)"
      SignificantEventsJC:
        title: "Sig Events (JC)"

table_columns_visible:
  rmats_summary:
    Contrast_Event: false

sp:
  rmats_summary:
    fn: "*_summary.rmats.txt"
